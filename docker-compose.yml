version: "3.9"

services:
  app:
    build: .
    image: grocery:latest
    ports:
      - "4173:4173"
    depends_on:
      - db
    env_file:
      - .env
    environment:
      VITE_FIREBASE_CONFIG: ${VITE_FIREBASE_CONFIG:-}
      VITE_APP_ID: ${VITE_APP_ID:-default-app-id}
      VITE_INITIAL_AUTH_TOKEN: ${VITE_INITIAL_AUTH_TOKEN:-}
    restart: unless-stopped

  db:
    image: postgres:16
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-appuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-apppassword}
      POSTGRES_DB: ${POSTGRES_DB:-appdb}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped

volumes:
  db_data:
    driver: local
